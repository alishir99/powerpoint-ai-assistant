<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Slide Assistant</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <section id="sideload-msg">
        <p>Open this add-in inside PowerPoint to use it.</p>
    </section>

    <main id="app-body" style="display: none;">
        <div id="messages" aria-live="polite">
            <section id="welcome">
                <h1 class="gradient">Create or improve slides</h1>
                <button class="suggestion" type="button"
                    data-text="Create 5 slides for the management team on how AI can save time in sales">
                    <span class="arrow">↪</span> Create a presentation from scratch
                </button>
                <button class="suggestion" type="button" data-text="Make this slide clearer and more concise">
                    <span class="arrow">↪</span> Improve the current slide
                </button>
                <button class="suggestion" type="button" data-text="Translate all slides to English">
                    <span class="arrow">↪</span> Translate the whole deck
                </button>
            </section>
        </div>

        <form id="composer">
            <div class="box">
                <textarea id="prompt" rows="1" placeholder="Ask the assistant"></textarea>
                <div class="row">
                    <button id="send" type="submit" aria-label="Send" disabled>
                        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                            <path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </div>
            </div>
            <p class="disclaimer">AI can make mistakes. Check the slides before you present.</p>
        </form>
    </main>
</body>

</html>
