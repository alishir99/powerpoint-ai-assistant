<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Slide Assistant</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <header>
        <h1>AI Slide Assistant</h1>
    </header>

    <section id="sideload-msg">
        <p>Open this add-in inside PowerPoint to use it.</p>
    </section>

    <main id="app-body" style="display: none;">
        <div id="messages" aria-live="polite">
            <div class="msg assistant">Hi! Tell me what your presentation is about, and I'll add the slides
                to this deck. For example: "5 slides for the management team on how AI can save time in
                sales".</div>
        </div>
        <form id="composer">
            <textarea id="prompt" rows="3" placeholder="Describe your slides… (Enter to send)"></textarea>
            <button id="send" type="submit">Send</button>
        </form>
    </main>
</body>

</html>
